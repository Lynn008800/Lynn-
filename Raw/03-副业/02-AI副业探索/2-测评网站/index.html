    desc: '放下手机，用手吃饭——有我在的局就不会冷场。你是当之无愧的社交之王。<br>你是那种自带气氛组属性的人。只要有你在，再无聊的局也能热起来。你不怕生，自来熟，而且你是真心喜欢跟人打交道的。<br>你热爱一切新鲜有趣的东西，而且是第一批去尝试的人。你讨厌无聊、讨厌重复、讨厌一成不变。你的生活信条是"活着就要折腾"。<br>你最大的魅力是你不在乎别人怎么看你——做自己，而且做得很开心。这种松弛感让所有人都想靠近你。',
    share: '小龙虾人格🦞 社交天花板，有我在的局不会冷场'
  }
};

const QUESTIONS = [
  { q: '朋友跟你吐槽同一件事第三遍了，你会？', labelA: '继续耐心听，朋友不就是用来听的嘛', valA: 'Q', labelB: '"这个问题我跟你说过了吧！听我的，现在就去解决"', valB: 'H' },
  { q: '遇到不公平的事，你的第一反应是？', labelA: '心里不舒服，但先忍忍，看情况再说', valA: 'Q', labelB: '不能忍，当场就要说清楚', valB: 'H' },
  { q: '出去旅游你更接近哪种状态？', labelA: '提前做攻略精确到每小时，连餐厅都订好了', valA: 'M', labelB: '订个机票酒店就够了，剩下的到了再说', valB: 'B' },
  { q: '看到一件心动但不便宜的东西，你会？', labelA: '先收藏，查测评，等冷静期过了再决定', valA: 'M', labelB: '喜欢就买，犹豫就会败北', valB: 'B' },
  { q: '连续社交三天后，你的真实状态是？', labelA: '电量耗尽，需要一个人待一天回血', valA: 'D', labelB: '还好啊，明天继续约', valB: 'Y' },
  { q: '一个人的周末，你更可能？', labelA: '享受得要死——这就是我最想要的周末', valA: 'D', labelB: '有点无聊，想找人出来玩', valB: 'Y' },
  { q: '去一家去了无数次的店，你通常会？', labelA: '点老几样，稳定的美味才是王道', valA: 'J', labelB: '试没吃过的，万一发现新大陆呢', valB: 'L' },
  { q: '你的歌单/外卖收藏夹更像？', labelA: '就那么几首/几家，反复听反复吃', valA: 'J', labelB: '一直在更新，新的来了旧的就走', valB: 'L' }
];

let currentQ = 0;
let scores = { Q:0, H:0, M:0, B:0, D:0, Y:0, J:0, L:0 };

function showPage(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function startQuiz() {
  currentQ = 0;
  scores = { Q:0, H:0, M:0, B:0, D:0, Y:0, J:0, L:0 };
  showPage('page-quiz');
  renderQ();
}

function renderQ() {
  const q = QUESTIONS[currentQ];
  document.getElementById('qText').textContent = q.q;
  document.getElementById('qCounter').textContent = (currentQ+1) + ' / 8';
  document.getElementById('qProgress').style.width = ((currentQ+1)/8*100) + '%';
  document.getElementById('qOptions').innerHTML =
    '<button onclick="answer(\'' + q.valA + '\')"><span class="opt-label">A</span>' + q.labelA + '</button>' +
    '<button onclick="answer(\'' + q.valB + '\')"><span class="opt-label">B</span>' + q.labelB + '</button>';
}

function answer(val) {
  scores[val]++;
  currentQ++;
  if (currentQ >= 8) {
    showResult();
  } else {
    renderQ();
  }
}

function showResult() {
  function dim(a, b) { return scores[a] > scores[b] ? a : (scores[a] < scores[b] ? b : (Math.random()<0.5?a:b)); }
  var key = dim('Q','H') + dim('M','B') + dim('D','Y') + dim('J','L');
  var food = FOODS[key];
  document.getElementById('rEmoji').textContent = food.emoji;
  document.getElementById('rName').textContent = food.name;
  document.getElementById('rDesc').innerHTML = food.desc;
  document.getElementById('rShare').textContent = food.share;
  showPage('page-result');
}

function copyResult() {
  var share = document.getElementById('rShare').textContent;
  var name = document.getElementById('rName').textContent;
  var url = window.location.href;
  var text = '【假如MBTI是道菜·我是' + name + '】\n' + share + '\n\n来测测你是哪道菜 👉 ' + url;
  navigator.clipboard.writeText(text).then(function() {
    toast('✅ 已复制，去发朋友圈吧！');
  }).catch(function() {
    var ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.left = '-9999px';
    document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta);
    toast('✅ 已复制，去发朋友圈吧！');
  });
}

function shareResult() {
  var url = window.location.href;
  navigator.clipboard.writeText(url).then(function() {
    toast('🔗 链接已复制，发给朋友测测吧！');
  }).catch(function() {
    var ta = document.createElement('textarea');
    ta.value = url; ta.style.position = 'fixed'; ta.style.left = '-9999px';
    document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta);
    toast('🔗 链接已复制，发给朋友测测吧！');
  });
}

function resetQuiz() { startQuiz(); }

function toast(msg) {
  var el = document.createElement('div');
  el.className = 'toast'; el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(function() { el.remove(); }, 1800);
}
</script>
</body>
</html>
